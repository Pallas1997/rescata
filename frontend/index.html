<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1877F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rescatá">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rescatá – cosas en la calle</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
<style>
  :root{
    --blue:#1877F2; --bg:#F0F2F5; --card:#fff; --text:#050505; --muted:#65676B; --line:#E4E6EB;
    --chip:#E4E6EB; --chip-on:#E7F3FF; --field:#fff; --field-line:#CED0D4; --soft:#FAFBFC;
    --green:#42B72A; --red:#E41E3F; --outer:#d9dde3; --map1:#e8eef3; --map2:#dfe7d8; --road:#fff; --new:#E7F3FF;
  }
  [data-theme="dark"]{
    --blue:#2D88FF; --bg:#18191A; --card:#242526; --text:#E4E6EB; --muted:#B0B3B8; --line:#3E4042;
    --chip:#3A3B3C; --chip-on:#263951; --field:#3A3B3C; --field-line:#4E4F50; --soft:#2C2D2E;
    --green:#45BD62; --outer:#0d0d0e; --map1:#2b3238; --map2:#2a3328; --road:#4a4d50; --new:#263951;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--outer);color:var(--text);display:flex;justify-content:center;transition:background .2s}
  .app{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.12)}
  .screen{flex:1;overflow-y:auto;display:none;padding-bottom:80px}
  .screen.active{display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;font-size:16px;color:var(--text)}

  .top{background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
  .logo{font-size:24px;font-weight:700;color:var(--blue);letter-spacing:-.5px}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
  .icon-btn svg{width:20px;height:20px}
  .search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:20px;padding:9px 14px;color:var(--muted)}
  .search input{border:none;background:none;outline:none;flex:1;font-size:15px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 14px;border-radius:18px;background:var(--chip);font-size:14px;font-weight:600;white-space:nowrap}
  .chip.on{background:var(--chip-on);color:var(--blue)}

  .banner{margin:10px 12px 0;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4;background:#FFF4CE;color:#5c4400;display:none}
  [data-theme="dark"] .banner{background:#3d3418;color:#f3dc92}
  .banner.show{display:block}
  .section-title{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-weight:700;font-size:17px}
  .section-title span{font-size:13px;font-weight:500;color:var(--blue)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 4px}
  .item{background:var(--card);border-radius:8px;overflow:hidden;text-align:left}
  .item .ph{aspect-ratio:1/1;width:100%;object-fit:cover;display:block;background:var(--chip)}
  .item .info{padding:8px 10px 10px}
  .item .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .free{font-size:13px;font-weight:700;color:var(--green);margin-bottom:2px}
  .item .loc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .rel{position:relative}
  .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px}
  .empty{text-align:center;color:var(--muted);padding:50px 30px;font-size:15px;line-height:1.5}
  .skel{aspect-ratio:1/1.3;border-radius:8px;background:linear-gradient(90deg,var(--card) 0%,var(--chip) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}

  .nav{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);flex:1;font-weight:500}
  .nav button svg{width:24px;height:24px}
  .nav button.on{color:var(--blue)}
  .nav .plus{width:44px;height:30px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;margin-bottom:2px}
  .nav .plus svg{width:20px;height:20px}
  .dot{position:absolute;top:-2px;right:-8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;display:none}

  .bar{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .bar h2{font-size:18px;flex:1}
  .bar .pub{color:var(--blue);font-weight:700;font-size:16px}
  .bar .pub:disabled{color:var(--muted);opacity:.6}
  .form{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border-radius:10px;padding:14px}
  .photo-box{border:2px dashed var(--field-line);border-radius:10px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);position:relative;overflow:hidden;background:var(--soft);width:100%;cursor:pointer}
  .photo-box .cam{width:56px;height:56px;border-radius:50%;background:var(--chip-on);display:grid;place-items:center;color:var(--blue)}
  .photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo-box .change{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:6px 12px;border-radius:16px;font-weight:600}
  .photo-actions{display:flex;gap:8px;margin-top:10px}
  .photo-actions label{flex:1;text-align:center;background:var(--chip);border-radius:8px;padding:10px;font-weight:600;font-size:14px;cursor:pointer}
  .lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
  .field{width:100%;border:1px solid var(--field-line);border-radius:8px;padding:12px;outline:none;background:var(--field)}
  .field:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--chip-on)}
  textarea.field{resize:none;min-height:90px}
  .count{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
  .cats{display:flex;flex-wrap:wrap;gap:8px}
  .loc-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:8px;background:var(--chip-on);color:var(--blue);font-weight:600;font-size:15px;margin-bottom:10px}
  .loc-btn svg{width:20px;height:20px}
  .loc-ok{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--green);font-weight:600;margin-bottom:10px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.4}
  .big-btn{width:100%;padding:13px;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:16px}
  .big-btn:disabled{opacity:.45}

  .detail{position:absolute;inset:0;background:var(--card);z-index:20;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease}
  .detail.open{transform:none}
  .detail .hero{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--chip)}
  .detail .back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;z-index:2}
  .d-body{padding:16px 16px 40px}
  .d-body h1{font-size:22px;line-height:1.25}
  .d-free{color:var(--green);font-weight:700;margin:4px 0 2px}
  .d-meta{color:var(--muted);font-size:14px}
  .d-actions{display:flex;gap:8px;margin:16px 0}
  .d-actions button{flex:1;padding:11px;border-radius:8px;font-weight:600;font-size:15px;background:var(--chip)}
  .d-actions .main{background:var(--blue);color:#fff}
  .d-actions button:disabled{opacity:.5}
  .d-sec{border-top:1px solid var(--line);padding:14px 0}
  .d-sec h3{font-size:17px;margin-bottom:8px}
  .d-sec p{font-size:15px;line-height:1.45}
  .map{height:150px;border-radius:10px;background:linear-gradient(135deg,var(--map1) 0%,var(--map2) 100%);position:relative;overflow:hidden;margin-top:10px}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .lmap{height:200px;border-radius:10px;overflow:hidden;margin:4px 0 10px;border:1px solid var(--line);z-index:0;position:relative}
  .lmap.big{height:220px;margin-top:10px}
  [data-theme="dark"] .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
  .leaflet-container{font-family:inherit;background:var(--chip)}
  .pin{width:30px;height:42px}
  .loc-warn{font-size:13px;line-height:1.4;color:#8a5a00;background:#FFF4CE;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  [data-theme="dark"] .loc-warn{background:#3d3418;color:#f3dc92}
  .user{display:flex;align-items:center;gap:10px}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
  .interest{font-size:14px;color:var(--muted);margin-top:6px}
  .link-row{display:flex;gap:18px;padding-top:6px}
  .link-row button{color:var(--muted);font-size:13.5px;font-weight:600}
  .link-row .danger{color:var(--red)}

  .push-card{margin:12px;background:var(--card);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
  .push-card .bell{width:42px;height:42px;border-radius:50%;background:var(--chip-on);display:grid;place-items:center;font-size:20px;flex:none}
  .push-card h4{font-size:15px;margin-bottom:3px}
  .push-card p{font-size:13.5px;color:var(--muted);line-height:1.4}
  .push-card .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .push-card .btns button{padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px;background:var(--chip)}
  .push-card .btns .ok{background:var(--blue);color:#fff}
  .steps{margin:6px 0 0 18px;color:var(--text);font-size:14px;line-height:1.6}
  .notif{display:flex;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
  .notif.new{background:var(--new)}
  .notif img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
  .notif p{font-size:14.5px;line-height:1.35}
  .notif small{color:var(--blue);font-size:12.5px;font-weight:600}

  .profile-head{background:var(--card);padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top));text-align:center}
  .profile-head .avatar{width:80px;height:80px;font-size:30px;margin:0 auto 10px}
  .stats{display:flex;justify-content:center;gap:30px;margin-top:12px}
  .stats b{display:block;font-size:20px}
  .stats span{font-size:13px;color:var(--muted)}
  .settings{margin:12px;background:var(--card);border-radius:10px;overflow:hidden}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;width:100%;text-align:left}
  .set-row:last-child{border-bottom:none}
  .set-row small{color:var(--muted)}
  .switch{width:46px;height:28px;border-radius:14px;background:var(--chip);position:relative;transition:.2s;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch.on{background:var(--blue)}
  .switch.on::after{left:21px}

  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}
  .sheet-bg.show{display:flex}
  .sheet{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h3{font-size:18px;margin-bottom:6px}
  .sheet p{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.4}
  .sheet .row{display:flex;gap:8px;margin-top:12px}
  .sheet .row button{flex:1;padding:12px;border-radius:8px;font-weight:700;font-size:15px;background:var(--chip)}
  .sheet .row .ok{background:var(--blue);color:#fff}
  .sheet .row .bad{background:var(--red);color:#fff}

  .popwrap{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:70;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .pop{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--card);color:var(--text);border-radius:14px;padding:10px 10px 10px 12px;box-shadow:0 10px 28px rgba(0,0,0,.28);border:1px solid var(--line);transform:translateY(-140%);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .2s;cursor:pointer;position:relative;overflow:hidden;touch-action:pan-x}
  .pop.show{transform:none;opacity:1}
  .pop img,.pop .ic{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:var(--chip-on);display:grid;place-items:center;font-size:22px}
  .pop .tx{flex:1;min-width:0}
  .pop .tx b{display:block;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pop .tx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--muted);line-height:1.3;margin-top:1px}
  .pop .tx small{font-size:11.5px;color:var(--blue);font-weight:700}
  .pop .x{width:28px;height:28px;border-radius:50%;background:var(--chip);flex:none;display:grid;place-items:center;font-size:13px;color:var(--muted)}
  .pop .timer{position:absolute;left:0;bottom:0;height:3px;background:var(--blue);width:100%;transform-origin:left;animation:popt 7s linear forwards}
  @keyframes popt{to{transform:scaleX(0)}}
  /* estrellas de calidad al publicar */
  .quality{background:var(--card);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .qstars{display:flex;gap:2px;line-height:0}
  .qstar{display:inline-block;width:28px;height:28px}
  .qstar svg{width:100%;height:100%;fill:var(--chip);stroke:var(--field-line);stroke-width:1;transition:fill .2s}
  .qstar.on svg{fill:#F7B928;stroke:#E09E00}
  .qstar.qpop{animation:starpop .5s cubic-bezier(.3,1.8,.5,1)}
  @keyframes starpop{0%{transform:scale(.4) rotate(-30deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
  .qtxt{font-size:13px;line-height:1.45;color:var(--muted);flex:1}
  .qtxt b{color:var(--text)}
  .qtxt .ok{color:var(--green);font-weight:600}
  /* festejo */
  .flash{position:absolute;inset:0;z-index:85;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 62%,rgba(255,236,150,.95) 0%,rgba(255,200,60,.55) 28%,rgba(255,170,0,0) 70%)}
  .flash.go{animation:flash .9s ease-out}
  @keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
  #fx{position:absolute;inset:0;z-index:86;pointer-events:none;width:100%;height:100%}
  .ring{position:absolute;left:50%;top:62%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid #F7B928;z-index:84;pointer-events:none;animation:ring .9s ease-out forwards}
  @keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(14);opacity:0}}
  .celebrate{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
  .celebrate.show{opacity:1;pointer-events:auto}
  .cel-card{background:var(--card);border-radius:20px;padding:26px 22px 20px;width:84%;max-width:330px;text-align:center;transform:scale(.7);transition:transform .45s cubic-bezier(.3,1.6,.5,1);position:relative;z-index:2}
  .celebrate.show .cel-card{transform:scale(1)}
  .cel-medal{font-size:68px;line-height:1;margin-bottom:8px;animation:medal 1.2s ease-in-out infinite alternate}
  @keyframes medal{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-6px) rotate(6deg)}}
  .cel-card h3{font-size:21px;margin-bottom:6px}
  .cel-card p{font-size:14px;color:var(--muted);line-height:1.45}
  .cel-stars{font-size:30px;margin:6px 0 4px;letter-spacing:4px}
  .cel-stars span{display:inline-block;opacity:0;animation:starin .45s cubic-bezier(.3,1.8,.5,1) forwards}
  @keyframes starin{from{opacity:0;transform:scale(.2) rotate(-60deg)}to{opacity:1;transform:scale(1)}}
  .cel-card .big-btn{margin-top:16px}
  .spark{position:absolute;top:50%;left:50%;font-size:22px;pointer-events:none;z-index:1;animation:spark 1.3s ease-out forwards}
  @keyframes spark{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
  /* rango en perfil */
  .rank-card{margin:12px;background:var(--card);border-radius:12px;padding:16px}
  .rank-top{display:flex;align-items:center;gap:12px}
  .rank-medal{font-size:44px;line-height:1}
  .rank-top h3{font-size:18px}
  .rank-top small{color:var(--muted);font-size:13px}
  .rank-bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:14px 0 6px}
  .rank-bar div{height:100%;border-radius:5px;background:linear-gradient(90deg,#F7B928,#F5533D);transition:width .8s ease}
  .rank-next{font-size:13px;color:var(--muted)}
  .rank-steps{display:flex;justify-content:space-between;margin-top:14px;gap:6px}
  .rank-steps div{flex:1;text-align:center;font-size:12px;color:var(--muted);padding:8px 2px;border-radius:8px;background:var(--bg)}
  .rank-steps div.done{color:var(--text);font-weight:600;background:var(--chip-on)}
  .rank-steps div b{display:block;font-size:22px;margin-bottom:2px;filter:grayscale(1);opacity:.5}
  .rank-steps div.done b{filter:none;opacity:1}
  .rank-tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:1px}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#323436;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes rot{to{transform:rotate(360deg)}}
</style>
<script>
  // Tema antes de pintar, para que no parpadee
  (function(){ let t=null; try{ t=localStorage.getItem('rescata_theme'); }catch(e){}
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t; })();
</script>
<script src="config.js"></script>
</head>
<body>
<div class="app" id="app">

  <!-- EXPLORAR -->
  <section class="screen active" id="s-feed">
    <div class="top">
      <div class="top-row">
        <div class="logo">rescatá</div>
        <div style="display:flex;gap:8px">
          <button class="icon-btn" onclick="toggleTheme()" aria-label="Cambiar tema" id="theme-btn"></button>
          <button class="icon-btn" onclick="go('publish')" aria-label="Publicar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>

<script>
const $ = id => document.getElementById(id);
const CATS = ['Muebles','Electrónica','Deco','Ropa','Libros','Plantas','Bicis','Otros'];
const API_URL = ((window.RESCATA_CONFIG||{}).API_URL || '').replace(/\/$/,'');
const POLL_MS = 20000;
const APP_VERSION = '__VERSION__';
let filter='Todo', selCat='Muebles', photo=null, gps=null, myPos=null, nearMe=false;
let posts=[], notif={interests:[],nearby:[]}, mode='loading', busy=false;

/* ---------- guardado local seguro ---------- */
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function deviceId(){
  let id = ls.get('rescata_device', null);
  if(!id){ id = (crypto.randomUUID ? crypto.randomUUID() : 'd'+Date.now()+Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g,''); ls.set('rescata_device', id); }
  return id;
}
const DEVICE = deviceId();
let NAME = ls.get('rescata_name', '');

/* ---------- API remota ---------- */
async function api(path, opts={}, timeout=20000){
  const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), timeout);
  try{
    const r = await fetch(API_URL+path, {...opts, signal:ctrl.signal, headers:{
      'Content-Type':'application/json','X-Device-Id':DEVICE,'X-Device-Name':encodeURIComponent(NAME||'Alguien')}});
    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error || 'Error '+r.status);
    return data;
  } catch(e){
    if(e.name==='AbortError') throw new Error('El servidor tardó demasiado en responder.');
    throw e;
  } finally { clearTimeout(tm); }
}

const remote = {
  async list(){ const qs = myPos ? `?lat=${myPos.lat}&lng=${myPos.lng}` : ''; return (await api('/api/posts'+qs)).posts; },
  async mine(){ return (await api('/api/posts?mine=1')).posts; },
  async create(p){ return (await api('/api/posts',{method:'POST',body:JSON.stringify(p)},60000)).post; },
  async interest(id){ return (await api(`/api/posts/${id}/interest`,{method:'POST',body:'{}'})).post; },
  async gone(id,g){ return (await api(`/api/posts/${id}/gone`,{method:'POST',body:JSON.stringify({gone:g})})).post; },
  async report(id,reason){ return api(`/api/posts/${id}/report`,{method:'POST',body:JSON.stringify({reason})}); },
  async remove(id){ return api(`/api/posts/${id}`,{method:'DELETE'}); },
  async notifications(since){
    const qs = new URLSearchParams({since: since||''}); if(myPos){ qs.set('lat',myPos.lat); qs.set('lng',myPos.lng); qs.set('radius_km', ls.get('rescata_push_radius', null) || 100000); }
    return api('/api/notifications?'+qs);
  }
};

/* ---------- modo demo (sin servidor) ---------- */
function ph(bg, emoji){
  const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><rect y="210" width="300" height="90" fill="#9aa3ad" opacity=".35"/><text x="150" y="175" font-size="120" text-anchor="middle">${emoji}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
}
function seed(){
  const n=Date.now(), m=60000;
  return [
    {id:'s1',title:'Silla de madera',desc:'Le falta un poco de barniz pero está firme. Ideal para restaurar.',cat:'Muebles',street:'Gorriti y Thames',hood:'Palermo',img:ph('#d8b98a','🪑'),t:n-12*m,interest:3,user:'Lucía'},
    {id:'s2',title:'Monitor 19"',desc:'Lo dejaron junto al contenedor. No sé si anda, tiene el cable.',cat:'Electrónica',street:'Av. Rivadavia 5200',hood:'Caballito',img:ph('#8fb0d6','🖥️'),t:n-40*m,interest:5,user:'Martín'},
    {id:'s3',title:'Cajón de libros',desc:'Novelas y algunos de cocina. Está en la vereda, se puede mojar si llueve.',cat:'Libros',street:'Humahuaca 4100',hood:'Almagro',img:ph('#c9a6d9','📚'),t:n-2*60*m,interest:1,user:'Sofi'},
    {id:'s4',title:'Planta monstera',desc:'Maceta grande, la planta está sana. Pesa bastante.',cat:'Plantas',street:'Av. Cabildo y Juramento',hood:'Belgrano',img:ph('#9fd3a4','🪴'),t:n-3*60*m,interest:7,user:'Nico'},
    {id:'s5',title:'Bici rodado 20',desc:'Para nene, cadena salida y gomas desinfladas.',cat:'Bicis',street:'Mitre 800',hood:'Quilmes',img:ph('#f0c27b','🚲'),t:n-5*60*m,interest:2,user:'Caro'},
    {id:'s6',title:'Lámpara de pie',desc:'Sin pantalla, la base es de metal y parece funcionar.',cat:'Deco',street:'San Martín 1500',hood:'Ramos Mejía',img:ph('#f3e39b','💡'),t:n-26*60*m,interest:0,user:'Juan',gone:true},
  ];
}
let mem = null;
const local = {
  _all(){ if(!mem) mem = ls.get('rescata_posts', null) || seed(); return mem; },
  _save(){ ls.set('rescata_posts', mem); },
  async list(){ return this._all().map(p=>({...p})); },
  async mine(){ return this._all().filter(p=>p.mine).map(p=>({...p})); },
  async create(p){ const n={...p,id:'p'+Date.now(),img:p.image,t:Date.now(),interest:0,mine:true,user:NAME||'Vos',
      gps:(p.lat!=null?{lat:p.lat,lng:p.lng}:null), street:p.street||(p.lat!=null?'Ubicación por GPS':'')};
    n.author_effective = this._all().filter(x=>x.mine&&(x.desc||'').trim().length>=MIN_DESC).length + ((p.desc||'').trim().length>=MIN_DESC?1:0);
    delete n.image; this._all().unshift(n); this._save(); return n; },
  async interest(id){ const p=this._all().find(x=>x.id===id); if(!p.going){p.going=true;p.interest=(p.interest||0)+1;} this._save(); return {...p}; },
  async gone(id,g){ const p=this._all().find(x=>x.id===id); p.gone=g; this._save(); return {...p}; },
  async report(){ return {ok:true}; },
  async remove(id){ mem=this._all().filter(x=>x.id!==id); this._save(); return {ok:true}; },
  async notifications(){ return {interests:this._all().filter(p=>p.mine&&p.interest>0).map(p=>({post_id:p.id,title:p.title,who:p.interest+' persona'+(p.interest>1?'s':''),img:p.img,t:p.t})),
      nearby:this._all().filter(p=>!p.mine&&!p.gone).slice(0,4), now:Date.now()}; }
};
const store = () => mode==='online' ? remote : local;

/* ---------- arranque ---------- */
async function boot(){
  renderChips(); setPhotoBox(); applyThemeUI(); renderSkeleton(); updateProfileHead(); renderPopsSwitch(); renderSoundSwitch(); renderRankCard(); check();
  if(!API_URL){ goDemo('No hay servidor configurado: estás en <b>modo demo</b>, lo que publiques queda solo en este celular.'); return; }
  showBanner('<span class="spin"></span>Conectando con el servidor… la primera vez del día puede tardar hasta un minuto.');
  try{
    await api('/api/health', {}, 75000);
    mode='online'; hideBanner();
    await refresh();
    initPush(); loadStats();
    if(new URLSearchParams(location.search).get('p')){ await openFromUrl(location.href); history.replaceState(null,'',location.pathname); }
    setInterval(()=>{ if(!document.hidden) refresh(true); }, POLL_MS);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(true); });
  }catch(e){
    goDemo('No pude conectar con el servidor (' + esc(e.message) + '). Estás en <b>modo demo</b>. <a href="#" onclick="location.reload();return false" style="color:inherit;font-weight:700">Reintentar</a>');
  }
}
async function goDemo(msg){ mode='demo'; showBanner(msg); await refresh(); initPush(); }
function showBanner(h){ $('banner').innerHTML=h; $('banner').classList.add('show'); }
function hideBanner(){ $('banner').classList.remove('show'); }

// Si hay una versión nueva publicada, recargamos solos (GitHub Pages guarda la vieja hasta 10 min)
async function checkUpdate(){
  try{
    const r = await fetch('version.json?ts='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const { v } = await r.json();
    if(v && APP_VERSION !== '__VER'+'SION__' && v !== APP_VERSION && !busy && !celActive){
      if(ls.get('rescata_reloaded_for', '') === v) return;
      ls.set('rescata_reloaded_for', v);
      location.reload();
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkUpdate(); });
setInterval(()=>{ if(!document.hidden) checkUpdate(); }, 60000);
async function refresh(silent){
  try{
    posts = await store().list();
    renderFeed(); updateProfileHead();
    await loadNotifs();
    if($('s-profile').classList.contains('active')) renderProfile();
  }catch(e){ if(!silent) toast('No se pudo actualizar: '+e.message); }
}

/* ---------- helpers ---------- */
function ago(t){
  const d = Math.max(1, Math.round((Date.now()-t)/60000));
  if(d<60) return `hace ${d} min`;
  const h=Math.round(d/60); if(h<24) return `hace ${h} h`;
  const dd=Math.round(h/24); return `hace ${dd} día${dd>1?'s':''}`;
}
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const km = d => d==null ? '' : (d<1 ? `a ${Math.round(d*1000)} m` : `a ${d.toLocaleString('es-AR',{maximumFractionDigits:1})} km`);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- tema ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function toggleTheme(){
  const t = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme=t; try{ localStorage.setItem('rescata_theme', t); }catch(e){}
  applyThemeUI();
}
function applyThemeUI(){
  const dark = document.documentElement.dataset.theme==='dark';
  $('theme-btn').innerHTML = dark ? SUN : MOON;
  $('theme-switch').classList.toggle('on', dark);
  document.querySelector('meta[name=theme-color]').content = dark ? '#242526' : '#1877F2';
}

/* ---------- hojas (modales) ---------- */
function sheet(html){ $('sheet').innerHTML=html; $('sheet-bg').classList.add('show'); }
function closeSheet(){ $('sheet-bg').classList.remove('show'); }
function askName(then){
  sheet(`<h3>¿Cómo te llamás?</h3><p>Así la gente sabe quién avisó del hallazgo o quién lo va a buscar. Puede ser un apodo.</p>
    <input class="field" id="name-in" maxlength="40" placeholder="Tu nombre o apodo" value="${esc(NAME)}">
    <div class="row"><button onclick="closeSheet()">Cancelar</button><button class="ok" id="name-ok">Guardar</button></div>`);
  setTimeout(()=>$('name-in').focus(), 50);
  $('name-ok').onclick = () => { const v=$('name-in').value.trim(); if(!v){ $('name-in').focus(); return; }
    NAME=v; ls.set('rescata_name', v); closeSheet(); updateProfileHead(); if(typeof then==='function') then(); };
}
function needName(then){ if(NAME) then(); else askName(then); }
function confirmSheet(title, text, okLabel, cls, fn){
  sheet(`<h3>${title}</h3><p>${text}</p><div class="row"><button onclick="closeSheet()">Cancelar</button><button class="${cls}" id="cf-ok">${okLabel}</button></div>`);
  $('cf-ok').onclick = () => { closeSheet(); fn(); };
}

/* ---------- navegación ---------- */
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('s-'+name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.go===name));
  closeDetail();
  if(name==='feed') renderFeed();
  if(name==='alerts'){ renderAlerts(); ls.set('rescata_seen', Date.now()); updateDot(); }
  if(name==='profile') renderProfile();
}

/* ---------- feed ---------- */
function renderChips(){
  $('filter-chips').innerHTML = `<button class="chip ${nearMe?'on':''}" onclick="toggleNear()">📍 Cerca mío</button>` +
    ['Todo',...CATS].map(c=>`<button class="chip ${c===filter?'on':''}" onclick="filter='${c}';renderChips();renderFeed()">${c}</button>`).join('');
  $('cat-chips').innerHTML = CATS.map(c=>`<button class="chip ${c===selCat?'on':''}" onclick="selCat='${c}';renderChips()">${c}</button>`).join('');
}
function renderSkeleton(){ $('grid').innerHTML = Array(6).fill('<div class="skel"></div>').join(''); }
function card(p){
  const where = p.distance_km!=null && nearMe ? km(p.distance_km) : (p.hood||p.street);
  return `<button class="item" onclick="openDetail('${p.id}')">
    <div class="rel"><img class="ph" src="${esc(p.img)}" alt="" loading="lazy">${p.gone?'<span class="badge">Ya no está</span>':''}</div>
    <div class="info"><div class="free">GRATIS</div><div class="t">${esc(p.title)}</div>
    <div class="loc">${esc(where)} · ${ago(p.t)}</div></div></button>`;
}
function renderFeed(){
  if(mode==='loading') return;
  const q = $('q').value.toLowerCase().trim();
  let list = posts.filter(p=>(filter==='Todo'||p.cat===filter) &&
    (!q || (p.title+' '+p.desc+' '+p.street+' '+p.hood).toLowerCase().includes(q)));
  list.sort((a,b)=> (a.gone-b.gone) || (nearMe && a.distance_km!=null && b.distance_km!=null ? a.distance_km-b.distance_km : b.t-a.t));
  $('feed-title').textContent = nearMe ? 'Lo más cerca tuyo' : 'Encontrado recientemente';
  $('count-lbl').textContent = list.length + ' objeto' + (list.length===1?'':'s');
  $('grid').innerHTML = list.length ? list.map(card).join('') :
    `<div class="empty" style="grid-column:1/-1">No hay hallazgos acá todavía.<br>¡Sé el primero en publicar uno!</div>`;
}
// Escucha el GPS unos segundos y se queda con la lectura más precisa
function getPos(opts={}){
  const maxWait = opts.maxWait || 7000, goodAcc = opts.goodAcc || 25;
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej({code:0});
    let best=null, done=false, wid=null;
    const finish = () => { if(done) return; done=true; if(wid!=null) navigator.geolocation.clearWatch(wid); clearTimeout(tm);
      best ? res(best) : rej({code:3}); };
    const tm = setTimeout(finish, maxWait);
    try{
      wid = navigator.geolocation.watchPosition(p=>{
        const r={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||9999)};
        if(!best || r.acc < best.acc) best=r;
        if(r.acc <= goodAcc) finish();
      }, err=>{ if(err.code===1 || !best){ done=true; clearTimeout(tm); if(wid!=null) navigator.geolocation.clearWatch(wid); rej(err); } },
      {enableHighAccuracy:true, timeout:maxWait, maximumAge:0});
    }catch(e){ clearTimeout(tm); rej({code:0}); }
  });
}
function gpsError(e){
  if(e && e.code===1) return 'Bloqueaste el permiso de ubicación. En iPhone: Ajustes → Privacidad → Localización → Safari → "Al usar la app" y activá "Ubicación exacta".';
  if(e && e.code===3) return 'El GPS tardó demasiado. Probá de nuevo al aire libre o escribí la calle abajo 👇';
  return 'No pude acceder a tu ubicación. Escribí la calle abajo 👇';

/* ---------- mapas (Leaflet + OpenStreetMap) ---------- */
const PIN = '<svg class="pin" viewBox="0 0 30 42"><path d="M15 1C7.3 1 1 7 1 14.6 1 25 15 41 15 41s14-16 14-26.4C29 7 22.7 1 15 1z" fill="#1877F2" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="5.5" fill="#fff"/></svg>';
function makeMap(el, pos, draggable, onMove){
  if(!window.L) return null;
  const m = L.map(el, {zoomControl:true, attributionControl:true, scrollWheelZoom:false}).setView([pos.lat,pos.lng], 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(m);
  const icon = L.divIcon({html:PIN, className:'', iconSize:[30,42], iconAnchor:[15,41]});
  const mk = L.marker([pos.lat,pos.lng], {icon, draggable}).addTo(m);
  if(pos.acc && pos.acc < 2000) m._acc = L.circle([pos.lat,pos.lng], {radius:pos.acc, color:'#1877F2', weight:1, fillOpacity:.08}).addTo(m);
  if(draggable){
    const moved = ll => { mk.setLatLng(ll); if(m._acc){ m.removeLayer(m._acc); m._acc=null; } onMove({lat:ll.lat, lng:ll.lng}); };
    mk.on('dragend', () => moved(mk.getLatLng()));
    m.on('click', e => moved(e.latlng));
  }
  m._marker = mk;
  setTimeout(()=>m.invalidateSize(), 60);
  return m;
}
let pubMap=null, detailMap=null, geoSeq=0;
async function fillAddress(pos){
  const seq = ++geoSeq;
  if(mode!=='online'){ return; }
  $('addr-status') && ($('addr-status').innerHTML='<span class="spin"></span>Buscando la dirección…');
  try{
    const a = await api(`/api/geocode/reverse?lat=${pos.lat.toFixed(6)}&lng=${pos.lng.toFixed(6)}`, {}, 15000);
    if(seq!==geoSeq) return;
    if(a.street) $('f-street').value = a.street;
    if(a.hood) $('f-hood').value = a.hood;
    $('addr-status') && ($('addr-status').textContent = a.street||a.hood ? 'Dirección completada. Podés corregirla si hace falta.' : 'No encontré la calle exacta, escribila abajo.');
  }catch(e){
    if(seq!==geoSeq) return;
    $('addr-status') && ($('addr-status').textContent='No pude averiguar la calle. El pin queda guardado igual; escribila abajo si querés.');

}

const PHOTO_EMPTY = `<div class="cam"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div><b style="color:var(--text)">Sacá una foto del objeto</b><span style="font-size:13px">Tocá para abrir la cámara</span>`;
function setPhotoBox(){ $('photo-box').innerHTML = photo ? `<img src="${photo}" alt=""><span class="change">Cambiar foto</span>` : PHOTO_EMPTY; }
function onPhoto(input){
  const f = input.files && input.files[0]; if(!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const max=1080, sc=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let q=.8; photo=c.toDataURL('image/jpeg',q);
    while(photo.length>1.3e6 && q>.4){ q-=.1; photo=c.toDataURL('image/jpeg',q); }
    URL.revokeObjectURL(url); setPhotoBox(); check();
  };
  img.onerror = () => toast('No pude leer esa foto, probá con otra');
  img.src=url; input.value='';
}

const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let swReg=null, pushOn=false, pushBusy=false;
function b64ToU8(b64){ const pad='='.repeat((4-b64.length%4)%4); const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(raw, c=>c.charCodeAt(0)); }
async function initPush(){
  if('serviceWorker' in navigator){
    try{
      swReg = await navigator.serviceWorker.register('sw.js');
      navigator.serviceWorker.addEventListener('message', ev => {
        if(!ev.data) return;
        if(ev.data.type==='open') openFromUrl(ev.data.url);
        if(ev.data.type==='push'){
          const d = ev.data.data || {};
          if(popsOn()){
            showPop({ key:d.tag, title:d.title, body:d.body, img:d.image, postId:d.post_id, kind:d.type });
            // Ya lo viste en el cartel: sacamos la notificación del sistema
            swReg && swReg.getNotifications({tag:d.tag}).then(ns=>ns.forEach(n=>n.close())).catch(()=>{});
          }
          refresh(true);
        }
      });
    }catch(e){ swReg=null; }
  }
  if(pushSupported && swReg){
    try{
      const sub = await swReg.pushManager.getSubscription();
      pushOn = !!sub && Notification.permission==='granted';
      if(pushOn && mode==='online') api('/api/push/subscribe',{method:'POST',body:JSON.stringify(subBody(sub))}).catch(()=>{});
    }catch(e){}
  }
  renderPush();
}
function subBody(sub){
  const r = ls.get('rescata_push_radius', null);
  return { subscription: sub.toJSON ? sub.toJSON() : sub, radius_km: r, lat: r&&myPos?myPos.lat:null, lng: r&&myPos?myPos.lng:null };
}
function pushState(){
  if(mode!=='online') return 'offline';
  if(isIOS && !isStandalone()) return 'ios-install';
  if(!pushSupported || !swReg) return 'unsupported';
  if(Notification.permission==='denied') return 'denied';
  return pushOn ? 'on' : 'off';
}
function renderPush(){
  const st = pushState(), r = ls.get('rescata_push_radius', null);
  const radiusBtns = `<div class="btns"><button class="${!r?'ok':''}" onclick="setRadius(null)">Todo</button><button class="${r?'ok':''}" onclick="setRadius(5)">Solo cerca (5 km)</button></div>`;
  const cards = {
    'off': `<div class="push-card"><div class="bell">🔔</div><div><h4>Enterate al toque</h4><p>Recibí una notificación cada vez que alguien publica un hallazgo, aunque tengas la app cerrada.</p><div class="btns"><button class="ok" onclick="enablePush()">Activar notificaciones</button></div></div></div>`,
    'on': `<div class="push-card"><div class="bell">✅</div><div><h4>Notificaciones activadas</h4><p>Te avisamos cuando alguien publica. ¿De qué querés enterarte?</p>${radiusBtns}<div class="btns"><button onclick="disablePush()">Desactivar</button></div></div></div>`,
    'ios-install': `<div class="push-card"><div class="bell">📲</div><div><h4>Para recibir notificaciones en iPhone</h4><p>Apple solo las permite si Rescatá está en tu pantalla de inicio:</p><ol class="steps"><li>Tocá <b>Compartir</b> (el cuadrado con flecha ↑) en Safari</li><li>Elegí <b>Agregar a inicio</b></li><li>Abrí Rescatá desde el ícono nuevo y volvé a esta pestaña</li></ol></div></div>`,
    'denied': `<div class="push-card"><div class="bell">🔕</div><div><h4>Notificaciones bloqueadas</h4><p>Las bloqueaste en este celular. Para activarlas: ${isIOS?'Ajustes → Notificaciones → Rescatá → Permitir notificaciones':'tocá el candado al lado de la dirección → Permisos → Notificaciones → Permitir'}.</p></div></div>`,
    'unsupported': `<div class="push-card"><div class="bell">ℹ️</div><div><h4>Notificaciones no disponibles</h4><p>Este navegador no soporta notificaciones. Probá con Chrome en Android o Safari en iPhone (iOS 16.4 o más nuevo).</p></div></div>`,
    'offline': ''
  };
  $('push-card').innerHTML = cards[st] || '';
  $('push-switch').classList.toggle('on', st==='on');
  $('push-sub').textContent = {on: r?'Activadas · solo cerca':'Activadas · todo', off:'Avisarme cuando alguien publica', 'ios-install':'Primero agregá la app a inicio', denied:'Bloqueadas en los ajustes', unsupported:'No disponible en este navegador', offline:'Necesita conexión'}[st];
}
async function enablePush(){
  if(pushBusy) return;
  const st = pushState();
  if(st==='offline'){ toast('Las notificaciones necesitan conexión con el servidor'); return; }
  if(st==='ios-install'){ go('alerts'); toast('Primero agregá Rescatá a tu pantalla de inicio'); return; }
  if(st==='unsupported' || st==='denied'){ go('alerts'); return; }
  pushBusy=true;
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Sin permiso no podemos avisarte'); return; }
    const reg = swReg || await navigator.serviceWorker.ready;
    const { publicKey } = await api('/api/push/key');
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(publicKey) });
    await api('/api/push/subscribe',{method:'POST',body:JSON.stringify(subBody(sub))});
    pushOn=true; toast('🔔 Listo, te avisamos cuando alguien publique');
  }catch(e){ toast('No se pudieron activar: '+(e.message||e)); }
  finally{ pushBusy=false; renderPush(); }
}
async function disablePush(){
  try{
    const sub = swReg && await swReg.pushManager.getSubscription();
    await api('/api/push/unsubscribe',{method:'POST',body:JSON.stringify({endpoint: sub?sub.endpoint:null})}).catch(()=>{});
    if(sub) await sub.unsubscribe();
  }catch(e){}
  pushOn=false; renderPush(); toast('Notificaciones desactivadas');
}

const popsOn = () => ls.get('rescata_popups', true);
let popSeen = new Set(ls.get('rescata_popseen', []));
function rememberPop(k){ popSeen.add(k); const arr=[...popSeen].slice(-300); popSeen=new Set(arr); ls.set('rescata_popseen', arr); }
function showPop({key, title, body, img, postId, kind}, force){
  if(!force && (!popsOn() || !key || popSeen.has(key))) return;
  if(key) rememberPop(key);
  const w=$('popwrap'); while(w.children.length>=3) w.firstChild.remove();
  const el=document.createElement('div'); el.className='pop'; el.setAttribute('role','alert');
  el.innerHTML = `${img?`<img src="${esc(img)}" alt="">`:`<div class="ic">${kind==='interest'?'🙋':'📍'}</div>`}
    <div class="tx"><small>RESCATÁ · ahora</small><b>${esc(title)}</b><span>${esc(body||'')}</span></div>
    <button class="x" aria-label="Cerrar">✕</button><div class="timer"></div>`;
  let closed=false;
  const close=()=>{ if(closed) return; closed=true; clearTimeout(el._t); el.style.transform=''; el.classList.remove('show'); setTimeout(()=>el.remove(),320); };
  el.querySelector('.x').onclick = e => { e.stopPropagation(); close(); };
  el.onclick = () => { close(); if(postId) openFromUrl('?p='+postId); };
  let y0=null, dy=0;
  el.addEventListener('touchstart', e=>{ y0=e.touches[0].clientY; dy=0; el.style.transition='none'; }, {passive:true});
  el.addEventListener('touchmove', e=>{ if(y0==null) return; dy=Math.min(0, e.touches[0].clientY-y0); el.style.transform=`translateY(${dy}px)`; }, {passive:true});
  el.addEventListener('touchend', e=>{ el.style.transition=''; y0=null; if(dy<-35){ e.preventDefault(); close(); } else el.style.transform=''; });
  w.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  el._t = setTimeout(close, 7000);
  try{ navigator.vibrate && navigator.vibrate(25); }catch(e){}
}

/* ---------- logros: rangos, estrellas, sonidos ---------- */
const MIN_DESC = 20;
const RANKS = [
  { min:0,  name:'Novato', medal:'🌱', color:'#8a8d91' },
  { min:1,  name:'Bronce', medal:'🥉', color:'#CD7F32' },
  { min:5,  name:'Plata',  medal:'🥈', color:'#A8A9AD' },
  { min:15, name:'Oro',    medal:'🥇', color:'#F7B928' },
];
const rankOf = n => RANKS.reduce((r,x)=> n>=x.min ? x : r, RANKS[0]);
const nextRank = n => RANKS.find(x=>x.min>n) || null;
const rankTag = n => { if(n==null) return ''; const r=rankOf(n); return `<span class="rank-tag">${r.medal} ${r.name}</span>`; };
let myStats = null;
async function loadStats(){
  try{
    if(mode==='online') myStats = await api('/api/me/stats');
    else { const m = posts.filter(p=>p.mine); myStats = { effective: m.filter(p=>(p.desc||'').trim().length>=MIN_DESC).length, total:m.length,
      interested: m.reduce((a,p)=>a+(p.interest||0),0), going: posts.filter(p=>p.going).length }; }

// Sonidos generados en el momento (sin archivos)
let actx = null;
const soundsOn = () => ls.get('rescata_sounds', true);
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(actx.state==='suspended') actx.resume(); return actx; }
['touchend','click'].forEach(ev=>document.addEventListener(ev, ()=>{ if(soundsOn()) audio(); }, {once:true, passive:true}));
function tone(freq, start, dur, type='sine', vol=.18){
  const a=audio(); if(!a) return; const t=a.currentTime+start;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function sfx(kind, n=1){
  if(!soundsOn()) return;
  try{
    if(kind==='star'){ const f=[880,1046.5,1318.5][Math.max(0,n-1)]||1046.5; tone(f,0,.18,'triangle',.16); tone(f*2,.04,.12,'sine',.05); }
    if(kind==='complete'){ [1046.5,1318.5,1568].forEach((f,i)=>tone(f,i*.07,.28,'triangle',.15)); }
    if(kind==='publish'){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.09,.35,'triangle',.17)); tone(2093,.38,.4,'sine',.06); }
    if(kind==='rankup'){ [392,523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.11,.45,'square',.07)); [1046.5,1318.5,1568].forEach(f=>tone(f,.6,.9,'triangle',.1)); }
    if(navigator.vibrate) navigator.vibrate(kind==='rankup'?[40,60,40,60,120]:kind==='publish'?[30,40,60]:15);
  }catch(e){}
}
function toggleSounds(){ ls.set('rescata_sounds', !soundsOn()); renderSoundSwitch(); if(soundsOn()) sfx('complete'); }
function renderSoundSwitch(){ $('snd-switch').classList.toggle('on', soundsOn()); }

// Festejos: destello + confeti en canvas
function confetti(opts={}){
  const cv=$('fx'), app=$('app'), dpr=Math.min(2, window.devicePixelRatio||1);
  const W=app.clientWidth, H=app.clientHeight; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const colors=['#F7B928','#FFD54F','#1877F2','#45BD62','#F5533D','#FF8AD8','#ffffff'];
  const ox=W/2, oy=H*(opts.y||.62), N=opts.n||140, parts=[];
  for(let i=0;i<N;i++){
    const a = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.5, v = 7+Math.random()*10;
    parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:5+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:colors[i%colors.length], star:Math.random()<.45, life:0, max:70+Math.random()*50});
  }
  const star=(x,y,r)=>{ ctx.beginPath(); for(let k=0;k<10;k++){ const rr=k%2?r*.45:r, an=k*Math.PI/5-Math.PI/2; ctx.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr);} ctx.closePath(); ctx.fill(); };
  cancelAnimationFrame(cv._raf);
  const tick=()=>{
    ctx.clearRect(0,0,W,H); let alive=0;
    for(const p of parts){
      if(p.life>p.max) continue; alive++; p.life++;
      p.vy+=.32; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.max); ctx.fillStyle=p.c; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if(p.star) star(0,0,p.s); else ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);
      ctx.restore();
    }
    if(alive) cv._raf=requestAnimationFrame(tick); else ctx.clearRect(0,0,W,H);
  };
  tick();
}
function burst(big){
  const f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  const r=document.createElement('div'); r.className='ring'; $('app').appendChild(r); setTimeout(()=>r.remove(),1000);
  confetti({n: big?220:150});
  if(big) setTimeout(()=>confetti({n:120, y:.45}), 450);
}
function sparks(n=22){
  const c=$('celebrate'), icons=['⭐','✨','🌟','⭐','💫'];
  for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='spark'; s.textContent=icons[i%icons.length];
    const ang=Math.random()*Math.PI*2, dist=120+Math.random()*160;
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px'); s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    s.style.setProperty('--r', (Math.random()*360-180)+'deg'); s.style.animationDelay=(Math.random()*.25)+'s';
    c.appendChild(s); setTimeout(()=>s.remove(), 1700); }
}
let celQueue = [], celActive = false;
function celebrate(html, sound){
  celQueue.push({html, sound});
  if(!celActive) nextCelebrate();
}
function nextCelebrate(){
  const it = celQueue.shift(); if(!it){ celActive=false; return; }
  celActive = true;
  const c=$('celebrate'); c.innerHTML=`<div class="cel-card">${it.html}<button class="big-btn" onclick="closeCelebrate()">¡Genial!</button></div>`;
  burst(it.sound==='rankup'); sfx(it.sound);
  setTimeout(()=>{ c.classList.add('show'); sparks(it.sound==='rankup'?34:20); }, 220);
}
function closeCelebrate(){ const c=$('celebrate'); c.classList.remove('show'); setTimeout(()=>{ c.innerHTML=''; nextCelebrate(); }, 260); }
function celebratePublish(effective, before, after){
  const stars = n => Array.from({length:3},(_,i)=>`<span style="animation-delay:${.15+i*.18}s">${i<n?'⭐':'☆'}</span>`).join('');
  const nr = nextRank(after);
  const progress = nr ? `Te ${nr.min-after===1?'falta 1 publicación efectiva':`faltan ${nr.min-after} publicaciones efectivas`} para ${nr.medal} ${nr.name}.` : '¡Llegaste al rango más alto! 🏆';
  if(effective){
    celebrate(`<div class="cel-medal">🎉</div><h3>¡Publicado!</h3><div class="cel-stars">${stars(3)}</div>
      <p><b>+1 publicación efectiva</b>. ${mode==='online'?'Ya le avisamos a la gente.':''}<br>${progress}</p>`, 'publish');
  } else {
    celebrate(`<div class="cel-medal">📣</div><h3>¡Publicado!</h3><div class="cel-stars">${stars(2)}</div>
      <p>Ya está visible, pero <b>no suma para tu rango</b>: la próxima agregá una descripción de ${MIN_DESC}+ caracteres para ganar las 3 estrellas.</p>`, 'publish');
  }
  if(before!=null && rankOf(after).min > rankOf(before).min){
    const r = rankOf(after);
    celebrate(`<div class="cel-medal">${r.medal}</div><h3>¡Subiste a ${r.name}!</h3>
      <p>Ya tenés <b>${after}</b> publicaci${after===1?'ón efectiva':'ones efectivas'}. Tu medalla ahora aparece al lado de tu nombre en todo lo que publiques.</p>`, 'rankup');
  }
}
function renderRankCard(){
  const n = myStats ? myStats.effective : 0, r = rankOf(n), nr = nextRank(n);
  const pct = nr ? Math.max(4, Math.round(100*n/nr.min)) : 100;
  $('p-rank').innerHTML = `${r.medal} ${r.name}`;
  $('rank-card').innerHTML = `
    <div class="rank-top"><div class="rank-medal">${r.medal}</div><div><h3>Rango ${r.name}</h3><small>${n} publicaci${n===1?'ón efectiva':'ones efectivas'}</small></div></div>
    <div class="rank-bar"><div style="width:${pct}%"></div></div>
    <div class="rank-next">${nr ? `${nr.min-n} más para ${nr.medal} ${nr.name}` : '¡Rango máximo alcanzado! 🏆'}</div>
    <div class="rank-steps">${RANKS.map(x=>`<div class="${n>=x.min?'done':''}"><b>${x.medal}</b>${x.name}<br>${x.min}</div>`).join('')}</div>
    <p class="hint" style="margin-top:12px">Una publicación es <b>efectiva</b> cuando tiene las 3 estrellas (foto, descripción de ${MIN_DESC}+ caracteres y ubicación) y no fue denunciada.</p>`;
}
